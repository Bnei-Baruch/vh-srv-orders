all: true
dir: './internal/mocks'
filename: '{{.InterfaceDirRelative}}_mocks.go'
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: 'mocks'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  gitlab.bbdev.team/vh/pay/orders/repo:
  # Consumer-declared interfaces: this package owns the storage contract its
  # own code uses (domain.AccountsRepo), so this is where its mock comes from —
  # mockery follows the interface, not the implementation.
  #
  # domain/pricing owns three such interfaces and is deliberately absent: its
  # tests use function adapters, so generating mocks for them would commit
  # generated code nothing calls.
  gitlab.bbdev.team/vh/pay/orders/domain:
  # Its own package, because the tests that use this mock are keycloak's own
  # consumers — pkg/accounting and pkg/profiles — and importing the combined
  # mocks package from there is an import cycle: that package also holds
  # accounting's and profiles' own mocks, which import them back.
  #
  # Emitted where those tests already import it. Before this, mockery wrote a
  # copy into the combined package that nothing imported, and the file the tests
  # do import was generated by an older layout and regenerated by nothing — so
  # adding a method to TokenSource would have updated the unused copy, exited 0,
  # and left three packages failing to compile against a stale mock.
  gitlab.bbdev.team/vh/pay/orders/pkg/keycloak:
    config:
      dir: './internal/mocks/pkg/keycloak'
      pkgname: 'keycloak'
      # Named after the package, not the interface: `all: true` means a second
      # interface in pkg/keycloak would otherwise be written into a file named
      # after the first one. The global template cannot be reused here — it
      # expands to pkg/keycloak_mocks.go, which under the dir above nests into
      # internal/mocks/pkg/keycloak/pkg/.
      filename: 'keycloak_mocks.go'
  gitlab.bbdev.team/vh/pay/orders/pkg/profiles:
  gitlab.bbdev.team/vh/pay/orders/pkg/pelecard:
  gitlab.bbdev.team/vh/pay/orders/pkg/accounting:

