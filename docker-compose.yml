# Project name pinned to "orders" (pre-rename compose project) so the running
# containers keep their identity.
name: orders
services:
  vh-srv-orders:
    image: "${IMAGE_NAME}"
    container_name: 'vh-srv-orders'
    restart: unless-stopped
    volumes:
      - /root/google_application_credentials.json:/vh_google_app_creds.json:ro
    environment:
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT}
      PGDATABASE: ${DB_DATABASE}
      APP_PORT: ${APP_PORT}
      APP_MODE: ${APP_MODE}
      APP_ENV: ${APP_ENV}
      NATS_URL: ${NATS_URL}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      SUFX: "${SUFX}"
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      PROFILE_SERVICE_URL: ${PROFILE_SERVICE_URL}
      GOOGLE_APPLICATION_CREDENTIALS: /vh_google_app_creds.json
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      IMPORT_SPECIALS_SPREADSHEET_ID: ${IMPORT_SPECIALS_SPREADSHEET_ID}
      RENEWAL_MAX_WORKERS: ${RENEWAL_MAX_WORKERS:-5}
      PRIORITY_BASE_URL: ${PRIORITY_BASE_URL}
      PRIORITY_USERNAME: ${PRIORITY_USERNAME}
      PRIORITY_PASSWORD: ${PRIORITY_PASSWORD}
      ACCOUNTING_SERVICE_URL: ${ACCOUNTING_SERVICE_URL}
      QUICKBOOKS_COMPANY_ID: ${QUICKBOOKS_COMPANY_ID}
    mem_limit: 250M
    ports:
      # Bound to loopback: host nginx is the only thing that talks to this, and
      # firewalld is disabled on the Rocky 9 hosts, so a 0.0.0.0 mapping would
      # publish the service straight onto the VM's public IP, bypassing the
      # edge LB and nginx entirely.
      - "127.0.0.1:8185:8185"
networks:
  default:
    name: vh
    external: true
